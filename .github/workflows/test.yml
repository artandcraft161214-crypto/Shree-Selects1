
name: Shree Ricka - ReelToTube AI 2.0

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: "Instagram Reel URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 2. INSTALL DEPENDENCIES
      # ==================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            yt-dlp \
            opencv-python-headless \
            numpy \
            Pillow \
            google-genai \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

          ffmpeg -version | head -n 2
          python3 --version
          yt-dlp --version

      # ==================================================
      # 3. DOWNLOAD INSTAGRAM REEL
      # ==================================================
      - name: Download Instagram Reel
        env:
          INSTAGRAM_URL: ${{ inputs.instagram_url }}
        run: |
          mkdir -p output

          if [ -z "$INSTAGRAM_URL" ]; then
            echo "ERROR: Instagram URL is missing."
            exit 1
          fi

          echo "Downloading Instagram Reel..."

          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -o "output/reel.%(ext)s" \
            "$INSTAGRAM_URL"

          if [ ! -s output/reel.mp4 ]; then
            echo "ERROR: Video download failed."
            ls -lh output/
            exit 1
          fi

          ls -lh output/reel.mp4

      # ==================================================
      # 4. VALIDATE VIDEO
      # ==================================================
      - name: Validate downloaded video
        run: |
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/reel.mp4

      # ==================================================
      # 5. ANALYZE BEST VIDEO SECTION
      # ==================================================
      - name: Find best video section
        run: |
          cat > analyze_video.py <<'PY'
          import cv2
          import numpy as np

          VIDEO = "output/reel.mp4"

          cap = cv2.VideoCapture(VIDEO)

          fps = cap.get(cv2.CAP_PROP_FPS)
          frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))

          if fps <= 0 or frames <= 0:
              raise RuntimeError("Invalid video information.")

          duration = frames / fps
          target_length = min(30.0, duration)

          print("Duration:", round(duration, 2))

          if duration <= 30:
              best_start = 0.0
          else:
              scores = []
              previous = None

              for second in range(int(duration)):
                  cap.set(
                      cv2.CAP_PROP_POS_MSEC,
                      second * 1000
                  )

                  ret, frame = cap.read()

                  if not ret:
                      continue

                  frame = cv2.resize(frame, (320, 180))
                  gray = cv2.cvtColor(
                      frame,
                      cv2.COLOR_BGR2GRAY
                  )

                  if previous is not None:
                      difference = cv2.absdiff(
                          gray,
                          previous
                      )

                      scores.append(
                          (second, float(np.mean(difference)))
                      )

                  previous = gray

              window = int(target_length)
              best_score = -1
              best_start = 0

              max_start = max(
                  1,
                  int(duration - target_length) + 1
              )

              for start in range(max_start):
                  score = sum(
                      value
                      for timestamp, value in scores
                      if start <= timestamp < start + window
                  )

                  if score > best_score:
                      best_score = score
                      best_start = start

          cap.release()

          with open("best_section.txt", "w") as f:
              f.write(str(best_start))

          with open("video_duration.txt", "w") as f:
              f.write(str(target_length))

          print("Best start:", best_start)
          print("Selected duration:", target_length)
          PY

          python3 analyze_video.py

      # ==================================================
      # 6. CREATE YOUTUBE SHORT
      # ==================================================
      - name: Create YouTube Short
        run: |
          START=$(cat best_section.txt)
          LENGTH=$(cat video_duration.txt)

          echo "Starting at: $START"
          echo "Duration: $LENGTH"

          ffmpeg -y \
            -ss "$START" \
            -i output/reel.mp4 \
            -t "$LENGTH" \
            -map 0:v:0 \
            -map '0:a:0?' \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output/youtube_short.mp4

          if [ ! -s output/youtube_short.mp4 ]; then
            echo "ERROR: Short creation failed."
            exit 1
          fi

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/youtube_short.mp4

      # ==================================================
      # 7. GEMINI VIDEO ANALYSIS AND SEO
      # ==================================================
      - name: Analyze Short with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > gemini_analysis.py <<'PY'
          import os
          import re
          import json
          import time

          from google import genai

          API_KEY = os.environ.get("GEMINI_API_KEY")
          VIDEO = "output/youtube_short.mp4"

          if not API_KEY:
              raise RuntimeError("GEMINI_API_KEY is missing.")

          if not os.path.exists(VIDEO):
              raise RuntimeError("Video file not found.")

          client = genai.Client(api_key=API_KEY)

          # Primary and backup models.
          MODELS = [
              "gemini-3.8-flash",
              "gemini-3.6-flash"
          ]

          PROMPT = r"""
          Analyze this actual YouTube Short video carefully.

          You are an expert Indian YouTube Shorts strategist.

          Return ONLY valid JSON:

          {
            "title": "",
            "description": "",
            "tags": "",
            "hashtags": "",
            "song_name": "",
            "artist": "",
            "best_moment": "",
            "category": "",
            "keywords": "",
            "pov_text": ""
          }

          ACCURACY:
          - Describe only what is visible or audible.
          - Never invent people, locations, artists, songs or brands.
          - Leave song_name and artist empty if uncertain.
          - Never claim guaranteed virality.

          TITLE:
          - One engaging accurate title.
          - Approximately 45-80 characters.
          - Must end with #Shorts.
          - No other hashtags.

          DESCRIPTION:
          - 2-4 natural sentences.
          - Describe actual video content.
          - Include relevant search terms.
          - Include a natural engagement question.
          - No separate hashtag block.

          HASHTAGS:
          - 8-12 relevant hashtags.
          - Include #Shorts and #YouTubeShorts.
          - Space separated.
          - No irrelevant viral hashtags.

          TAGS:
          - Comma-separated SEO tags.
          - Aim for 350-450 characters.
          - Maximum 490 characters.
          - No duplicates.

          BEST_MOMENT:
          - Approximate timestamp.
          - Identify strongest visual moment.
          - Suggest the best opening hook.

          CATEGORY:
          Choose one:
          Entertainment, Music, People & Blogs, Comedy,
          Sports, Howto & Style, Education.

          KEYWORDS:
          - 15-25 relevant keywords.
          - Comma separated.

          POV_TEXT:
          - One short Hinglish caption in Roman script.
          - Relatable and catchy.
          - Maximum 10 words.
          - Maximum 55 characters.
          - No POV: prefix.
          - No emojis.
          - No ALL CAPS.
          - No invented song lyrics.

          Return valid JSON only.
          No Markdown fences.
          """

          def parse_json(text):
              text = text.strip()

              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(r"\s*```$", "", text)

              start = text.find("{")
              end = text.rfind("}")

              if start < 0 or end < 0:
                  raise ValueError("JSON not found.")

              return json.loads(text[start:end + 1])

          def clean_metadata(data):
              if not isinstance(data, dict):
                  raise ValueError("Invalid JSON object.")

              defaults = {
                  "title": "Amazing Dance Performance",
                  "description": (
                      "Enjoy this amazing dance performance. "
                      "Watch till the end and share your thoughts!"
                  ),
                  "tags": (
                      "dance, dance performance, dance video, "
                      "dance moves, youtube shorts, dance shorts"
                  ),
                  "hashtags": (
                      "#Shorts #YouTubeShorts #Dance "
                      "#DancePerformance #DanceVideo"
                  ),
                  "song_name": "",
                  "artist": "",
                  "best_moment": "Strongest dance sequence",
                  "category": "Entertainment",
                  "keywords": (
                      "dance, dance performance, dance video, "
                      "dance moves, youtube shorts"
                  ),
                  "pov_text": "Steps clean hain, vibe alag hi hai"
              }

              for key, value in defaults.items():
                  if not isinstance(data.get(key), str):
                      data[key] = value

              title = re.sub(
                  r"\s*#Shorts\s*$",
                  "",
                  data["title"].strip(),
                  flags=re.IGNORECASE
              )

              data["title"] = (
                  (title or defaults["title"])[:90].strip()
                  + " #Shorts"
              )

              data["description"] = (
                  data["description"].strip()
                  or defaults["description"]
              )

              hashtags = []

              for tag in data["hashtags"].split():
                  tag = tag.strip()

                  if not tag:
                      continue

                  if not tag.startswith("#"):
                      tag = "#" + tag

                  if tag.lower() not in [
                      x.lower() for x in hashtags
                  ]:
                      hashtags.append(tag)

              for tag in ["#Shorts", "#YouTubeShorts"]:
                  if tag.lower() not in [
                      x.lower() for x in hashtags
                  ]:
                      hashtags.append(tag)

              data["hashtags"] = " ".join(hashtags[:12])

              seo_tags = []

              for tag in data["tags"].split(","):
                  tag = tag.strip().replace("#", "")

                  if tag and tag.lower() not in [
                      x.lower() for x in seo_tags
                  ]:
                      seo_tags.append(tag)

              final_tags = []

              for tag in seo_tags:
                  candidate = ", ".join(final_tags + [tag])

                  if len(candidate) > 490:
                      break

                  final_tags.append(tag)

              data["tags"] = ", ".join(final_tags)

              keywords = []

              for item in data["keywords"].split(","):
                  item = item.strip()

                  if item and item.lower() not in [
                      x.lower() for x in keywords
                  ]:
                      keywords.append(item)

              data["keywords"] = ", ".join(keywords[:25])

              pov = re.sub(
                  r"^\s*POV\s*:\s*",
                  "",
                  data["pov_text"].strip(),
                  flags=re.IGNORECASE
              )

              pov = re.sub(r"\s+", " ", pov)
              pov = " ".join(pov.split()[:10])[:55].strip()

              data["pov_text"] = (
                  pov or defaults["pov_text"]
              )

              categories = [
                  "Entertainment",
                  "Music",
                  "People & Blogs",
                  "Comedy",
                  "Sports",
                  "Howto & Style",
                  "Education"
              ]

              if data["category"] not in categories:
                  data["category"] = "Entertainment"

              return data

          print("================================")
          print("GEMINI VIDEO ANALYSIS")
          print("================================")

          video_file = client.files.upload(file=VIDEO)

          print("Uploaded:", video_file.name)

          # Wait for video processing.
          waited = 0
          max_wait = 600

          while waited < max_wait:
              video_file = client.files.get(
                  name=video_file.name
              )

              state = (
                  video_file.state.name
                  if video_file.state else "UNKNOWN"
              )

              print("Gemini state:", state)

              if state == "ACTIVE":
                  break

              if state == "FAILED":
                  raise RuntimeError(
                      "Gemini video processing failed."
                  )

              time.sleep(5)
              waited += 5

          else:
              raise TimeoutError(
                  "Gemini video processing timed out."
              )

          result = None
          last_error = None

          for model in MODELS:
              for attempt in range(3):
                  try:
                      print("Model:", model)
                      print(
                          f"Attempt {attempt + 1}/3"
                      )

                      response = client.models.generate_content(
                          model=model,
                          contents=[
                              video_file,
                              PROMPT
                          ]
                      )

                      if not response or not response.text:
                          raise ValueError(
                              "Empty Gemini response."
                          )

                      result = clean_metadata(
                          parse_json(response.text)
                      )

                      print("Gemini generation successful.")
                      break

                  except Exception as error:
                      last_error = error

                      print(
                          "Gemini error:",
                          type(error).__name__,
                          str(error)[:400]
                      )

                      if attempt < 2:
                          delay = min(
                              10 * (2 ** attempt),
                              60
                          )

                          print(
                              "Retrying in",
                              delay,
                              "seconds."
                          )

                          time.sleep(delay)

              if result is not None:
                  break

              print("Trying backup model.")

          if result is None:
              raise RuntimeError(
                  "Gemini failed on all configured models. "
                  "Stopping upload to avoid incorrect metadata. "
                  + str(last_error)
              )

          with open(
              "metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("GENERATED METADATA")
          print("================================")

          print(json.dumps(
              result,
              ensure_ascii=False,
              indent=2
          ))

          print("Saved: metadata.json")
          PY

          python3 gemini_analysis.py

      # ==================================================
      # 8. CREATE HINGLISH POV OVERLAY
      # ==================================================
      - name: Add AI Hinglish POV overlay
        run: |
          python3 - <<'PY'
          import json
          import re

          from PIL import Image, ImageDraw, ImageFont

          with open("metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          pov = str(
              metadata.get("pov_text", "")
          ).strip()

          pov = re.sub(r"\s+", " ", pov)
          pov = " ".join(pov.split()[:10])
          pov = pov[:55]

          if not pov:
              pov = "Steps clean hain, vibe alag hi hai"

          font_path = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          font = ImageFont.truetype(font_path, 44)

          temp = Image.new("RGBA", (10, 10))
          draw = ImageDraw.Draw(temp)

          lines = []
          current = ""

          for word in pov.split():
              candidate = (
                  word if not current
                  else current + " " + word
              )

              width = draw.textbbox(
                  (0, 0),
                  candidate,
                  font=font
              )[2]

              if width <= 820:
                  current = candidate
              else:
                  if current:
                      lines.append(current)
                  current = word

          if current:
              lines.append(current)

          lines = lines[:2]

          padding_x = 28
          padding_y = 18
          spacing = 8

          boxes = [
              draw.textbbox((0, 0), line, font=font)
              for line in lines
          ]

          text_width = max(
              b[2] - b[0] for b in boxes
          )

          text_height = sum(
              b[3] - b[1] for b in boxes
          ) + max(0, len(lines) - 1) * spacing

          width = text_width + padding_x * 2
          height = text_height + padding_y * 2

          card = Image.new(
              "RGBA",
              (width, height),
              (0, 0, 0, 0)
          )

          d = ImageDraw.Draw(card)

          d.rounded_rectangle(
              (0, 0, width - 1, height - 1),
              radius=20,
              fill=(255, 255, 255, 255)
          )

          y = padding_y

          for line in lines:
              bbox = d.textbbox(
                  (0, 0),
                  line,
                  font=font
              )

              line_width = bbox[2] - bbox[0]
              line_height = bbox[3] - bbox[1]

              x = (width - line_width) // 2

              d.text(
                  (x, y),
                  line,
                  font=font,
                  fill=(0, 0, 0, 255)
              )

              y += line_height + spacing

          card.save("output/pov_card.png")

          with open("output/pov.txt", "w") as f:
              f.write("\n".join(lines))

          metadata["pov_text"] = pov

          with open("metadata.json", "w", encoding="utf-8") as f:
              json.dump(
                  metadata,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("POV:", pov)
          PY

          ffmpeg -y \
            -i output/youtube_short.mp4 \
            -i output/pov_card.png \
            -filter_complex \
            "[1:v]format=rgba[card];[0:v][card]overlay=x=(main_w-overlay_w)/2:y=90:format=auto" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a copy \
            -movflags +faststart \
            output/final_short.mp4

          mv output/final_short.mp4 output/youtube_short.mp4

          echo "POV overlay added."

      # ==================================================
      # 9. CHECK YOUTUBE OAUTH SECRETS
      # ==================================================
      - name: Prepare YouTube OAuth
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID" ]; then
            echo "ERROR: YOUTUBE_CLIENT_ID missing."
            exit 1
          fi

          if [ -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "ERROR: YOUTUBE_CLIENT_SECRET missing."
            exit 1
          fi

          if [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "ERROR: YOUTUBE_REFRESH_TOKEN missing."
            exit 1
          fi

          echo "YouTube OAuth secrets are configured."

      # ==================================================
      # 10. UPLOAD TO YOUTUBE
      # ==================================================
      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os
          import json
          import re
          import unicodedata

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          CLIENT_ID = os.environ.get("YOUTUBE_CLIENT_ID")
          CLIENT_SECRET = os.environ.get("YOUTUBE_CLIENT_SECRET")
          REFRESH_TOKEN = os.environ.get("YOUTUBE_REFRESH_TOKEN")

          if not CLIENT_ID:
              raise RuntimeError("YOUTUBE_CLIENT_ID is missing.")

          if not CLIENT_SECRET:
              raise RuntimeError("YOUTUBE_CLIENT_SECRET is missing.")

          if not REFRESH_TOKEN:
              raise RuntimeError("YOUTUBE_REFRESH_TOKEN is missing.")

          with open("metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          title = str(
              metadata.get("title", "")
          ).strip()

          description = str(
              metadata.get("description", "")
          ).strip()

          hashtags = str(
              metadata.get("hashtags", "")
          ).strip()

          raw_tags = str(
              metadata.get("tags", "")
          )

          if not title:
              raise RuntimeError("Video title is empty.")

          def clean_tag(value):
              value = unicodedata.normalize(
                  "NFKC",
                  str(value)
              )

              value = re.sub(
                  r"https?://\S+|www\.\S+",
                  " ",
                  value,
                  flags=re.I
              )

              value = value.replace("#", " ")

              value = "".join(
                  ch for ch in value
                  if unicodedata.category(ch) not in ("Cc", "Cf")
              )

              value = re.sub(r"\s+", " ", value).strip()
              return value.replace(",", " ")

          tags = []

          for item in raw_tags.split(","):
              tag = clean_tag(item)

              if not tag:
                  continue

              if len(tag) > 80:
                  tag = tag[:80].rstrip()

              if tag.casefold() not in [
                  old.casefold() for old in tags
              ]:
                  tags.append(tag)

          final_tags = []
          total = 0

          for tag in tags:
              addition = len(tag) + (
                  1 if final_tags else 0
              )

              if total + addition > 450:
                  break

              final_tags.append(tag)
              total += addition

          final_description = (
              description + "\n\n" + hashtags
          ).strip()

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          print("Refreshing YouTube OAuth...")

          credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": final_description[:5000],
                  "tags": final_tags,
                  "categoryId": "10"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          def upload_video(upload_body):
              media = MediaFileUpload(
                  "output/youtube_short.mp4",
                  mimetype="video/mp4",
                  resumable=True
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=upload_body,
                  media_body=media
              )

              response = None

              while response is None:
                  status, response = request.next_chunk()

                  if status:
                      print(
                          "Upload progress:",
                          int(status.progress() * 100),
                          "%"
                      )

              return response

          print("Uploading Short to YouTube...")
          print("Title:", title)
          print("SEO tag count:", len(final_tags))

          try:
              response = upload_video(body)

          except HttpError as error:
              error_text = str(error)

              print("YouTube API error:", error_text)

              if (
                  getattr(error.resp, "status", None) == 400
                  and "invalidTags" in error_text
              ):
                  print("Retrying upload without SEO tags.")

                  retry_body = {
                      "snippet": {
                          "title": title[:100],
                          "description": final_description[:5000],
                          "categoryId": "10"
                      },
                      "status": {
                          "privacyStatus": "public",
                          "selfDeclaredMadeForKids": False
                      }
                  }

                  response = upload_video(retry_body)
              else:
                  raise

          video_id = response.get("id")

          if not video_id:
              raise RuntimeError(
                  "YouTube did not return a video ID."
              )

          result = {
              "video_id": video_id,
              "url": (
                  "https://www.youtube.com/watch?v="
                  + video_id
              ),
              "title": title,
              "seo_tag_count": len(final_tags),
              "seo_tag_characters": len(", ".join(final_tags))
          }

          with open(
              "youtube_upload_result.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("UPLOAD SUCCESSFUL")
          print("================================")
          print("Video URL:", result["url"])
          PY

          python3 upload_youtube.py

      # ==================================================
      # 11. VERIFY UPLOAD
      # ==================================================
      - name: Check YouTube upload result
        run: |
          if [ ! -s youtube_upload_result.json ]; then
            echo "ERROR: Upload result not found."
            exit 1
          fi

          cat youtube_upload_result.json

      # ==================================================
      # 12. SAVE ARTIFACTS
      # ==================================================
      - name: Save processed videos and metadata
        uses: actions/upload-artifact@v4
        with:
          name: reel-to-youtube-result
          path: |
            output/reel.mp4
            output/youtube_short.mp4
            output/pov.txt
