      # ============================================================

      # ============================================================
      # 16. PREPARE YOUTUBE METADATA
      # ============================================================
      - name: Prepare YouTube metadata
        run: |

          python3 - <<'PY'

          import json
          import re

          INPUT_FILE = "output/metadata.json"
          OUTPUT_FILE = "output/youtube_upload.json"

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          title = str(data.get("title", "")).strip()
          description = str(data.get("description", "")).strip()
          category = str(data.get("category", "")).strip()
          raw_tags = data.get("tags", "")

          if not title:
              raise RuntimeError("YouTube title is empty.")

          if not description:
              raise RuntimeError("YouTube description is empty.")

          # YouTube title limit.
          title = title[:100]

          category_map = {
              "Music": "10",
              "Entertainment": "24",
              "People & Blogs": "22",
              "Comedy": "23",
              "Sports": "17",
              "Howto & Style": "26",
              "Education": "27"
          }

          category_id = category_map.get(
              category,
              "24"
          )

          if isinstance(raw_tags, str):
              raw_tags = raw_tags.split(",")
          elif not isinstance(raw_tags, list):
              raw_tags = []

          clean_tags = []
          seen = set()
          total_length = 0

          for item in raw_tags:

              tag = str(item).strip()

              if not tag:
                  continue

              tag = tag.replace("#", " ")

              tag = re.sub(
                  r"https?://\S+|www\.\S+",
                  " ",
                  tag,
                  flags=re.IGNORECASE
              )

              tag = re.sub(
                  r"[\x00-\x1F\x7F]",
                  " ",
                  tag
              )

              tag = re.sub(
                  r"[^A-Za-z0-9\s]",
                  " ",
                  tag
              )

              tag = re.sub(
                  r"\s+",
                  " ",
                  tag
              ).strip()

              if not tag:
                  continue

              tag = tag[:60].strip()

              key = tag.lower()

              if key in seen:
                  continue

              extra = len(tag)

              if clean_tags:
                  extra += 1

              # Stay comfortably below YouTube's 500-character limit.
              if total_length + extra > 450:
                  break

              clean_tags.append(tag)
              seen.add(key)
              total_length += extra

          output = {
              "title": title,
              "description": description,
              "tags": clean_tags,
              "category_id": category_id
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==========================================")
          print("       YOUTUBE UPLOAD METADATA")
          print("==========================================")
          print("")
          print("TITLE:")
          print(title)
          print("")
          print("CATEGORY:")
          print(category)
          print("")
          print("CATEGORY ID:")
          print(category_id)
          print("")
          print("SEO TAG COUNT:")
          print(len(clean_tags))
          print("")
          print("SEO TAG CHARACTERS:")
          print(len(",".join(clean_tags)))
          print("")
          print("SEO TAGS:")
          print(",".join(clean_tags))
          print("")
          print("==========================================")

          PY


      # ============================================================
      # 17. UPLOAD SHORT TO YOUTUBE
      # ============================================================
      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}

        run: |

          cat > upload_youtube.py <<'PY'

          import json
          import os
          import re
          import time

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          from googleapiclient.http import MediaFileUpload


          VIDEO_FILE = "output/youtube_short.mp4"
          METADATA_FILE = "output/youtube_upload.json"
          RESULT_FILE = "output/youtube_result.json"


          print("")
          print("==========================================")
          print("          YOUTUBE UPLOAD")
          print("==========================================")


          # ==========================================================
          # CHECK SECRETS
          # ==========================================================

          client_id = os.environ.get("YOUTUBE_CLIENT_ID")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")
          privacy = os.environ.get("YOUTUBE_PRIVACY", "private").lower().strip()

          if not client_id:
              raise RuntimeError("YOUTUBE_CLIENT_ID secret is missing.")

          if not client_secret:
              raise RuntimeError("YOUTUBE_CLIENT_SECRET secret is missing.")

          if not refresh_token:
              raise RuntimeError("YOUTUBE_REFRESH_TOKEN secret is missing.")

          if privacy not in {"private", "unlisted", "public"}:
              raise RuntimeError(
                  f"Invalid YouTube privacy status: {privacy}"
              )


          # ==========================================================
          # CHECK FILES
          # ==========================================================

          if not os.path.isfile(VIDEO_FILE):
              raise RuntimeError(
                  f"Video file not found: {VIDEO_FILE}"
              )

          if not os.path.isfile(METADATA_FILE):
              raise RuntimeError(
                  f"Metadata file not found: {METADATA_FILE}"
              )


          # ==========================================================
          # LOAD METADATA
          # ==========================================================

          with open(
              METADATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              metadata = json.load(f)

          title = str(
              metadata.get("title", "YouTube Short")
          ).strip()

          description = str(
              metadata.get("description", "")
          ).strip()

          category_id = str(
              metadata.get("category_id", "24")
          )

          tags = metadata.get("tags", [])

          if not isinstance(tags, list):
              tags = []


          # ==========================================================
          # FINAL TAG SAFETY
          # ==========================================================

          safe_tags = []
          seen = set()
          total_length = 0

          for tag in tags:

              tag = str(tag).strip()

              if not tag:
                  continue

              tag = tag.replace("#", " ")
              tag = tag.replace(",", " ")

              tag = re.sub(
                  r"https?://\S+|www\.\S+",
                  " ",
                  tag,
                  flags=re.IGNORECASE
              )

              tag = re.sub(
                  r"[\x00-\x1F\x7F]",
                  " ",
                  tag
              )

              tag = " ".join(tag.split())
              tag = tag[:60].strip()

              if not tag:
                  continue

              key = tag.lower()

              if key in seen:
                  continue

              extra = len(tag)

              if safe_tags:
                  extra += 1

              if total_length + extra > 450:
                  break

              safe_tags.append(tag)
              seen.add(key)
              total_length += extra

          tags = safe_tags


          # ==========================================================
          # CREATE OAUTH CREDENTIALS
          # ==========================================================

          print("")
          print("Creating YouTube OAuth credentials...")

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          # ==========================================================
          # REFRESH ACCESS TOKEN
          # ==========================================================

          print("Refreshing YouTube access token...")

          try:

              credentials.refresh(Request())

          except Exception as e:

              print("")
              print("==========================================")
              print("          YOUTUBE OAUTH ERROR")
              print("==========================================")
              print("")
              print(
                  "The YouTube refresh token could not be refreshed."
              )
              print("")
              print(
                  "YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET and "
                  "YOUTUBE_REFRESH_TOKEN must belong to the SAME "
                  "Google OAuth client."
              )
              print("")
              print("Original error:")
              print(repr(e))

              raise RuntimeError(
                  "YouTube OAuth refresh failed. "
                  "Check that all three GitHub secrets belong to "
                  "the same OAuth client and regenerate the refresh "
                  "token if necessary."
              )


          print("YouTube access token refreshed successfully.")


          # ==========================================================
          # BUILD YOUTUBE CLIENT
          # ==========================================================

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          # ==========================================================
          # UPLOAD FUNCTION
          # ==========================================================

          def upload_video(upload_tags):

              body = {
                  "snippet": {
                      "title": title,
                      "description": description,
                      "tags": upload_tags,
                      "categoryId": category_id
                  },
                  "status": {
                      "privacyStatus": privacy,
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  VIDEO_FILE,
                  mimetype="video/mp4",
                  resumable=True
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = None

              while response is None:

                  status, response = request.next_chunk()

                  if status:
                      progress = int(
                          status.progress() * 100
                      )
                      print(
                          f"Upload progress: {progress}%"
                      )

              return response


          # ==========================================================
          # UPLOAD WITH SAFE RETRIES
          # ==========================================================

          response = None
          final_tags = tags
          max_attempts = 3

          for attempt in range(1, max_attempts + 1):

              try:

                  print("")
                  print("==========================================")
                  print(
                      f"STARTING YOUTUBE UPLOAD "
                      f"(attempt {attempt}/{max_attempts})"
                  )
                  print("==========================================")

                  response = upload_video(final_tags)

                  break

              except HttpError as error:

                  status = getattr(
                      error.resp,
                      "status",
                      None
                  )

                  error_text = str(error)

                  print("")
                  print(
                      f"YouTube API error: HTTP {status}"
                  )
                  print(error_text)

                  if (
                      status == 400
                      and "invalidTags" in error_text
                      and final_tags
                  ):

                      print("")
                      print(
                          "YouTube rejected the SEO tags. "
                          "Retrying without tags..."
                      )

                      final_tags = []
                      response = upload_video(final_tags)
                      break

                  if (
                      status in [500, 502, 503, 504]
                      and attempt < max_attempts
                  ):

                      wait_time = attempt * 5

                      print(
                          f"Temporary server error. "
                          f"Retrying in {wait_time} seconds..."
                      )

                      time.sleep(wait_time)
                      continue

                  raise


          if not response:
              raise RuntimeError(
                  "YouTube upload failed."
              )


          # ==========================================================
          # RESULT
          # ==========================================================

          video_id = response.get("id")

          if not video_id:
              raise RuntimeError(
                  "YouTube returned no video ID."
              )

          video_url = (
              "https://www.youtube.com/watch?v="
              + video_id
          )

          response_snippet = response.get(
              "snippet",
              {}
          )

          channel_id = response_snippet.get(
              "channelId",
              ""
          )

          channel_name = response_snippet.get(
              "channelTitle",
              ""
          )


          result = {
              "status": "uploaded",
              "success": True,
              "video_id": video_id,
              "url": video_url,
              "title": title,
              "channel": channel_name,
              "channel_id": channel_id,
              "privacy": privacy,
              "seo_tag_count": len(final_tags),
              "seo_tag_characters": len(
                  ",".join(final_tags)
              )
          }


          with open(
              RESULT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("==========================================")
          print("       YOUTUBE UPLOAD SUCCESS")
          print("==========================================")
          print("")
          print("Channel:", channel_name)
          print("Channel ID:", channel_id)
          print("Video ID:", video_id)
          print("YouTube URL:", video_url)
          print("Privacy:", privacy)
          print("SEO tags:", len(final_tags))
          print("")
          print("Upload result saved:", RESULT_FILE)
          print("==========================================")


          PY

          python3 upload_youtube.py


