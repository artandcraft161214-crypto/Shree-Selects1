name: ReelToTube Processor

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: "Instagram Reel URL"
        required: true
        type: string

      youtube_privacy:
        description: "YouTube privacy status"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW INPUT
      # ============================================================
      - name: Show Reel URL
        run: |
          echo "=========================================="
          echo "        ReelToTube Processor"
          echo "=========================================="
          echo ""
          echo "Instagram URL:"
          echo "${{ inputs.instagram_url }}"
          echo ""
          echo "=========================================="


      # ============================================================
      # 3. INSTALL FFMPEG
      # ============================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 3

          echo ""
          echo "FFprobe:"
          ffprobe -version | head -n 3


      # ============================================================
      # 4. CHECK PYTHON
      # ============================================================
      - name: Check Python
        run: |
          python3 --version
          python3 -m pip --version


      # ============================================================
      # 5. INSTALL YT-DLP
      # ============================================================
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp
          yt-dlp --version


      # ============================================================
      # 6. DOWNLOAD INSTAGRAM REEL
      # ============================================================
      - name: Download Instagram Reel
        run: |

          mkdir -p output

          echo "=========================================="
          echo "       DOWNLOADING INSTAGRAM REEL"
          echo "=========================================="

          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -o "output/reel.%(ext)s" \
            "${{ inputs.instagram_url }}"

          echo ""
          echo "Download completed."

          ls -lh output/


      # ============================================================
      # 7. CHECK VIDEO
      # ============================================================
      - name: Check downloaded video
        run: |

          echo "=========================================="
          echo "       DOWNLOADED VIDEO INFORMATION"
          echo "=========================================="

          ls -lh output/

          if [ ! -f "output/reel.mp4" ]; then
            echo "ERROR: output/reel.mp4 was not found."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/reel.mp4


      # ============================================================
      # 8. INSTALL VIDEO ANALYSIS TOOLS
      # ============================================================
      - name: Install video analysis tools
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            opencv-python-headless \
            numpy \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      # ============================================================
      # 9. FIND BEST SECTION
      # ============================================================
      - name: Find best section
        run: |

          cat > analyze_video.py <<'PY'

          import cv2
          import numpy as np


          VIDEO = "output/reel.mp4"


          cap = cv2.VideoCapture(VIDEO)


          fps = cap.get(
              cv2.CAP_PROP_FPS
          )

          frame_count = int(
              cap.get(
                  cv2.CAP_PROP_FRAME_COUNT
              )
          )


          if fps <= 0:
              fps = 30


          duration = (
              frame_count / fps
          )


          print("==========================================")
          print("             VIDEO ANALYSIS")
          print("==========================================")
          print(f"FPS: {fps}")
          print(f"Frames: {frame_count}")
          print(f"Duration: {duration:.2f} seconds")


          # Maximum Short length
          short_length = min(
              30.0,
              duration
          )


          # If video is shorter than 30 seconds,
          # simply start from zero.

          if duration <= 30:

              best_start = 0.0

          else:

              scores = []

              previous = None

              second = 0


              while second < duration:

                  cap.set(
                      cv2.CAP_PROP_POS_MSEC,
                      second * 1000
                  )


                  ret, frame = cap.read()


                  if not ret:
                      break


                  frame = cv2.resize(
                      frame,
                      (320, 180)
                  )


                  gray = cv2.cvtColor(
                      frame,
                      cv2.COLOR_BGR2GRAY
                  )


                  if previous is not None:

                      difference = cv2.absdiff(
                          gray,
                          previous
                      )


                      score = float(
                          np.mean(difference)
                      )


                      scores.append(
                          (
                              second,
                              score
                          )
                      )


                  previous = gray

                  second += 1


              cap.release()


              if not scores:

                  best_start = 0.0

              else:

                  window = int(
                      short_length
                  )

                  best_start = 0

                  best_score = -1


                  for start in range(
                      0,
                      max(
                          1,
                          int(duration)
                      )
                  ):

                      end = (
                          start
                          + window
                      )


                      total = sum(
                          score
                          for timestamp, score
                          in scores
                          if (
                              start
                              <= timestamp
                              < end
                          )
                      )


                      if total > best_score:

                          best_score = total

                          best_start = start


                  # Do not exceed duration.

                  if (
                      best_start
                      + short_length
                      > duration
                  ):

                      best_start = max(
                          0,
                          duration
                          - short_length
                      )


          print("")
          print("==========================================")
          print("           BEST SECTION FOUND")
          print("==========================================")

          print(
              f"Start: {best_start:.2f} seconds"
          )

          print(
              f"Length: {short_length:.2f} seconds"
          )


          with open(
              "best_section.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(best_start)
              )


          print("==========================================")

          PY


          python3 analyze_video.py


      # ============================================================
      # 10. CREATE YOUTUBE SHORT
      # ============================================================
      - name: Create YouTube Short
        run: |

          START=$(cat best_section.txt)


          echo "=========================================="
          echo "        CREATING YOUTUBE SHORT"
          echo "=========================================="

          echo "Start position:"
          echo "${START}s"


          ffmpeg \
            -y \
            -ss "${START}" \
            -i output/reel.mp4 \
            -t 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -movflags +faststart \
            output/youtube_short.mp4


          echo ""
          echo "YouTube Short created."

          ls -lh output/


      # ============================================================
      # 11. CHECK SHORT
      # ============================================================
      - name: Check final Short
        run: |

          echo "=========================================="
          echo "         FINAL SHORT INFORMATION"
          echo "=========================================="


          if [ ! -f "output/youtube_short.mp4" ]; then

            echo "ERROR:"
            echo "youtube_short.mp4 was not created."

            exit 1

          fi


          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            output/youtube_short.mp4


      # ============================================================
      # 12. INSTALL GEMINI SDK
      # ============================================================
      - name: Install Gemini SDK
        run: |

          python3 -m pip install --upgrade google-genai


      # ============================================================
      # 13. GEMINI VIDEO ANALYSIS
      # ============================================================
      - name: Analyze Short with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          cat > gemini_analysis.py <<'PY'

          import os
          import json
          import time
          import re

          from google import genai


          print("==========================================")
          print("          GEMINI VIDEO ANALYSIS")
          print("==========================================")


          # ========================================================
          # API KEY
          # ========================================================

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )


          if not api_key:

              raise RuntimeError(
                  "GEMINI_API_KEY secret is not configured."
              )


          client = genai.Client(
              api_key=api_key
          )


          video_path = (
              "output/youtube_short.mp4"
          )


          # ========================================================
          # UPLOAD VIDEO TO GEMINI
          # ========================================================

          print("")
          print(
              "Uploading video to Gemini..."
          )


          video_file = client.files.upload(
              file=video_path
          )


          print(
              f"Gemini file: {video_file.name}"
          )


          # ========================================================
          # WAIT FOR PROCESSING
          # ========================================================

          print("")
          print(
              "Waiting for Gemini video processing..."
          )


          while True:

              video_file = client.files.get(
                  name=video_file.name
              )


              state = (

                  video_file.state.name

                  if video_file.state

                  else "UNKNOWN"

              )


              print(
                  f"Video state: {state}"
              )


              if state == "ACTIVE":

                  break


              if state == "FAILED":

                  raise RuntimeError(
                      "Gemini failed to process video."
                  )


              time.sleep(5)


          # ========================================================
          # SEO + SONG ANALYSIS PROMPT
          # ========================================================

          prompt = r"""
          You are an expert YouTube Shorts viral SEO strategist,
          music-identification analyst, video-content analyst and metadata
          specialist.

          Analyze the uploaded video DEEPLY before generating any metadata.
          Do not just look at the visuals. Actively analyze the AUDIO/MUSIC,
          spoken words, lyrics, rhythm, melody, visible text and overall
          context whenever the information is available in the video.

          ========================================================
          1. VIDEO ANALYSIS
          ========================================================

          Identify:

          - Main subject/person/people
          - Main action or performance
          - Dance style/choreography if applicable
          - Clothing/outfit and visual style when relevant
          - Setting/background when relevant
          - Visible text or captions
          - Language used or heard
          - Mood/emotion/energy
          - Video context
          - Likely target audience
          - Strongest visual hook
          - Strongest audio hook
          - Most replayable moment
          - Search intent
          - Important searchable phrases

          ========================================================
          2. SONG / MUSIC IDENTIFICATION — VERY IMPORTANT
          ========================================================

          Carefully listen to the audio and analyze the music used in the
          Short. Try to identify the exact song whenever reasonably possible.

          Check ALL available evidence:

          - Lyrics or clearly audible words
          - Chorus/hook lyrics
          - Melody and recognizable musical pattern
          - Beat/rhythm/music style
          - Singer/voice characteristics when useful
          - On-screen text mentioning the song
          - Captions/subtitles containing lyrics
          - Audio intro/outro
          - Repeated lyric phrases
          - Any visible Instagram/Reel music information present in the video

          If you can confidently identify the song from the audio or visible
          evidence, provide:

          - Exact song title
          - Artist/singer if identifiable
          - Original singer if identifiable
          - Movie/album if identifiable
          - Language
          - Music genre/style
          - Release year/era ONLY if confidently known
          - Most recognizable lyric/hook
          - Approximate timestamp where the important song section occurs
          - Confidence level: HIGH, MEDIUM or LOW
          - Evidence explaining why the identification is likely correct
          - Search phrases people could use to find this song

          IMPORTANT SONG RULE:

          NEVER invent or guess an exact song title, artist, movie, album or
          release year just because it would make the metadata look better.

          If the exact song cannot be identified confidently from the uploaded
          video's audio/visual evidence, say so explicitly.

          In that case:
          - Set song_identified to false
          - Use empty strings for unknown exact song fields
          - Describe the music style/audio characteristics instead
          - Provide useful audio-based search terms without pretending they
            are the exact song name

          Do NOT identify a song solely because a dance style resembles a
          popular song.

          ========================================================
          3. SONG-AWARE SEO STRATEGY
          ========================================================

          If the song is confidently identified, naturally incorporate the
          song title and artist/singer into the description and SEO tags when
          relevant.

          Create song-specific search terms such as:

          - song title
          - song title + dance
          - song title + shorts
          - song title + choreography
          - song title + reel
          - artist + song title
          - singer + song title
          - movie/album + song title
          - lyric/hook phrase + song

          Only include these when the song identification is supported.

          If the song is NOT confidently identified, use music-style,
          lyric-based and topic-based keywords instead. Never fabricate a
          song name.

          ========================================================
          4. RETURN ONLY VALID JSON
          ========================================================

          Use exactly this structure:

          {
            "title": "",
            "description": "",
            "hashtags": "",
            "tags": "",
            "best_moment": "",
            "category": "",
            "keywords": "",
            "song_details": {
              "song_identified": false,
              "song_name": "",
              "artist": "",
              "singer": "",
              "movie_or_album": "",
              "language": "",
              "genre_or_style": "",
              "release_year_or_era": "",
              "lyric_or_hook": "",
              "timestamp": "",
              "confidence": "LOW",
              "evidence": "",
              "search_terms": ""
            }
          }

          ========================================================
          5. TITLE
          ========================================================

          Generate ONE YouTube Shorts title.

          Requirements:

          - Approximately 40-70 characters when possible.
          - Strong hook.
          - Curiosity driven.
          - Accurate to the actual video.
          - SEO friendly.
          - Natural language.
          - Emojis allowed when appropriate.
          - NO hashtags in title.
          - NO misleading claims.
          - Do not provide multiple titles.

          If the song is confidently identified and the song is important to
          the video, naturally use the song name in the title when that helps
          search intent. Do not force it.

          ========================================================
          6. DESCRIPTION
          ========================================================

          Generate an SEO optimized YouTube Shorts description.

          Requirements:

          - 2-4 engaging sentences.
          - Explain what is actually happening.
          - Naturally include important keywords.
          - Include relevant niche keywords.
          - Include a simple engagement CTA.
          - Do not keyword stuff.
          - Do not repeat sentences.
          - Do not include a separate hashtag block inside description.

          If the song is confidently identified, naturally mention the song
          title and artist/singer where useful. If it is not identified,
          describe the music without inventing a name.

          ========================================================
          7. HASHTAGS
          ========================================================

          Generate approximately 35-40 highly relevant hashtags.

          MUST include:

          #Shorts
          #YouTubeShorts

          Use relevant:

          - niche hashtags
          - topic hashtags
          - subject hashtags
          - audience hashtags
          - dance hashtags if applicable
          - music hashtags if applicable
          - song-specific hashtags ONLY if the song is confidently identified
          - artist/singer hashtags ONLY if confidently identified
          - movie/album hashtags ONLY if confidently identified
          - Indian/Hindi hashtags when genuinely relevant
          - searchable topic variations

          Rules:

          - Every hashtag starts with #
          - No spaces inside hashtags
          - No duplicates
          - No unrelated hashtags
          - No spam hashtags
          - Avoid #fyp unless genuinely relevant
          - Return ONE space-separated string.

          ========================================================
          8. SEO TAGS
          ========================================================

          Generate highly relevant YouTube SEO tags.

          Target:

          400-480 characters.

          NEVER exceed 500 characters.

          Prioritize:

          1. Exact topic
          2. Exact subject
          3. Song title and artist/singer when confidently identified
          4. Song title + dance/reel/shorts/choreography variations
          5. Main keyword
          6. Long-tail keywords
          7. Search phrases
          8. Related keywords
          9. Content type
          10. Audience keywords
          11. Shorts-related keywords
          12. Indian/Hindi keywords when relevant
          13. English variations
          14. Common spelling variations

          Rules:

          - comma separated
          - no hashtags
          - no URLs
          - no unrelated viral keywords
          - no duplicate tags
          - maximum 500 characters
          - Do not sacrifice relevance just to reach 500 characters.

          ========================================================
          9. BEST MOMENT
          ========================================================

          Identify the strongest hook/moment.

          Include:

          - approximate timestamp
          - what happens visually
          - what happens in the audio/music
          - why it may retain viewers

          ========================================================
          10. CATEGORY
          ========================================================

          Select the best YouTube category.

          Examples:

          Entertainment
          Music
          People & Blogs
          Comedy
          Sports
          Howto & Style
          Education

          ========================================================
          11. KEYWORDS
          ========================================================

          Generate 20-30 relevant searchable keywords.

          Include:

          - primary keywords
          - secondary keywords
          - long-tail keywords
          - topic variations
          - audience searches
          - song-related searches when confidently identified
          - artist/singer searches when confidently identified
          - Indian/Hindi keywords when relevant

          Return comma-separated keywords.

          ========================================================
          12. FINAL QUALITY CONTROL
          ========================================================

          Before returning:

          1. Analyze the AUDIO as well as the visuals.
          2. Try to identify the exact song from lyrics/audio/on-screen evidence.
          3. Do not invent song names or artists.
          4. If uncertain, clearly mark the song as not confidently identified.
          5. Verify title is accurate and clickable.
          6. Verify description is natural.
          7. Generate approximately 35-40 relevant hashtags.
          8. Include #Shorts.
          9. Include #YouTubeShorts.
          10. Remove duplicate hashtags.
          11. Keep hashtags relevant.
          12. Generate SEO tags around 400-480 characters.
          13. NEVER exceed 500 tag characters.
          14. Include song-specific SEO only when supported by evidence.
          15. Remove unrelated keywords.
          16. Remove misleading hashtags.
          17. Return ONLY valid JSON.

          """

          # ========================================================
          # GENERATE
          # ========================================================

          print("")
          print(
              "Sending video to Gemini..."
          )


          response = client.models.generate_content(

              model="gemini-3.6-flash",

              contents=[
                  video_file,
                  prompt
              ]

          )


          text = (
              response.text
              .strip()
          )


          # ========================================================
          # CLEAN JSON
          # ========================================================

          if text.startswith("```"):

              text = text.replace(
                  "```json",
                  ""
              )

              text = text.replace(
                  "```",
                  ""
              )

              text = text.strip()


          try:

              data = json.loads(
                  text
              )

          except json.JSONDecodeError:

              print("")
              print(
                  "Gemini returned invalid JSON:"
              )

              print(text)

              raise


          # ========================================================
          # CLEAN HASHTAGS
          # ========================================================

          hashtags = data.get(
              "hashtags",
              ""
          )


          if isinstance(
              hashtags,
              list
          ):

              hashtags = " ".join(
                  str(x)
                  for x in hashtags
              )


          hashtag_tokens = str(
              hashtags
          ).split()


          unique_hashtags = []

          seen_hashtags = set()


          for hashtag in hashtag_tokens:

              hashtag = str(
                  hashtag
              ).strip()


              if not hashtag:
                  continue


              # Keep letters, numbers,
              # underscore and #

              hashtag = re.sub(
                  r"[^A-Za-z0-9_#]",
                  "",
                  hashtag
              )


              if not hashtag:
                  continue


              if not hashtag.startswith("#"):

                  hashtag = "#" + hashtag


              key = hashtag.lower()


              if key not in seen_hashtags:

                  seen_hashtags.add(
                      key
                  )

                  unique_hashtags.append(
                      hashtag
                  )


          # ========================================================
          # MANDATORY HASHTAGS
          # ========================================================

          mandatory = [
              "#Shorts",
              "#YouTubeShorts"
          ]


          for hashtag in reversed(
              mandatory
          ):

              if (
                  hashtag.lower()
                  not in seen_hashtags
              ):

                  unique_hashtags.insert(
                      0,
                      hashtag
                  )

                  seen_hashtags.add(
                      hashtag.lower()
                  )


          unique_hashtags = (
              unique_hashtags[:40]
          )


          data["hashtags"] = (
              " ".join(
                  unique_hashtags
              )
          )


          # ========================================================
          # CLEAN SEO TAGS
          # ========================================================

          tags = data.get(
              "tags",
              ""
          )


          if isinstance(
              tags,
              str
          ):

              raw_tags = [
                  x.strip()
                  for x in tags.split(",")
                  if x.strip()
              ]

          elif isinstance(
              tags,
              list
          ):

              raw_tags = [
                  str(x).strip()
                  for x in tags
                  if str(x).strip()
              ]

          else:

              raw_tags = []


          final_tags = []

          seen_tags = set()

          current_length = 0


          for tag in raw_tags:

              tag = str(
                  tag
              ).strip()


              if not tag:
                  continue


              # Remove hashtags

              tag = tag.replace(
                  "#",
                  " "
              )


              # Remove URLs

              tag = re.sub(
                  r"https?://\S+|www\.\S+",
                  " ",
                  tag,
                  flags=re.IGNORECASE
              )


              # Keep ASCII letters,
              # numbers and spaces

              tag = re.sub(
                  r"[^A-Za-z0-9\s]",
                  " ",
                  tag
              )


              # Normalize whitespace

              tag = re.sub(
                  r"\s+",
                  " ",
                  tag
              ).strip()


              if not tag:
                  continue


              # Individual tag max length

              tag = tag[:60].strip()


              key = tag.lower()


              if key in seen_tags:
                  continue


              extra = len(tag)


              if final_tags:
                  extra += 1


              # Keep maximum 490 characters
              # for safety.

              if (
                  current_length
                  + extra
                  > 490
              ):

                  break


              final_tags.append(
                  tag
              )

              seen_tags.add(
                  key
              )

              current_length += extra


          data["tags"] = ",".join(
              final_tags
          )


          # ========================================================
          # CLEAN DESCRIPTION
          # ========================================================

          description = str(
              data.get(
                  "description",
                  ""
              )
          ).strip()


          # Remove accidental hashtag marker

          if "[HASHTAG BLOCK]" in description:

              description = (
                  description
                  .split(
                      "[HASHTAG BLOCK]"
                  )[0]
                  .strip()
              )


          # Add hashtags to description

          if data["hashtags"]:

              if (
                  data["hashtags"].lower()
                  not in description.lower()
              ):

                  description = (
                      description
                      + "\n\n"
                      + data["hashtags"]
                  ).strip()


          data["description"] = (
              description
          )


          # ========================================================
          # VALIDATE
          # ========================================================

          title = str(
              data.get(
                  "title",
                  ""
              )
          ).strip()


          if not title:

              raise RuntimeError(
                  "Gemini generated an empty title."
              )


          title = title[:100]


          data["title"] = title


          hashtag_count = len(
              data["hashtags"].split()
          )


          seo_length = len(
              data["tags"]
          )


          print("")
          print("==========================================")
          print("         METADATA QUALITY CHECK")
          print("==========================================")

          print("")
          print("TITLE:")
          print(data["title"])

          print("")
          print("DESCRIPTION:")
          print(data["description"])

          print("")
          print(
              f"HASHTAGS: {hashtag_count}"
          )

          print(
              data["hashtags"]
          )

          print("")
          print(
              f"SEO TAG CHARACTERS: {seo_length}"
          )

          print(
              data["tags"]
          )

          print("")
          print("BEST MOMENT:")
          print(
              data.get(
                  "best_moment",
                  ""
              )
          )

          print("")
          print("CATEGORY:")
          print(
              data.get(
                  "category",
                  ""
              )
          )

          print("")
          print("KEYWORDS:")
          print(
              data.get(
                  "keywords",
                  ""
              )
          )

          print("")
          print("==========================================")


          # ========================================================
          # SAVE
          # ========================================================

          os.makedirs(
              "output",
              exist_ok=True
          )


          with open(
              "output/metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "metadata.json created successfully."
          )

          PY


          python3 gemini_analysis.py


      # ============================================================
      # 14. SHOW GENERATED METADATA
      # ============================================================
      - name: Show Generated Metadata
        run: |

          echo "=========================================="
          echo "       GENERATED YOUTUBE METADATA"
          echo "=========================================="

          cat output/metadata.json

          echo ""
          echo "=========================================="


      # ============================================================
      # ============================================================
      # 15. CREATE HUMAN-READABLE REVIEW FILE
      # ============================================================
      - name: Create Review File
        run: |

          python3 - <<'PY'

          import json

          with open(
              "output/metadata.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          title = data.get("title", "")
          description = data.get("description", "")
