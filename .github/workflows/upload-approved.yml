name: Upload Approved Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Run ID containing the processed Reel"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW RUN ID
      # ============================================================
      - name: Show Run ID
        run: |
          echo "=========================================="
          echo "       UPLOAD APPROVED SHORT"
          echo "=========================================="
          echo ""
          echo "Source Run ID:"
          echo "${{ inputs.run_id }}"
          echo ""
          echo "=========================================="


      # ============================================================
      # 3. DOWNLOAD REVIEW ARTIFACT
      # ============================================================
      - name: Download processed Reel package
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}

        run: |

          echo "=========================================="
          echo "       DOWNLOADING REVIEW PACKAGE"
          echo "=========================================="

          rm -rf review
          mkdir -p review

          ARTIFACT_NAME="ReelToTube-Review-${RUN_ID}"

          echo ""
          echo "Artifact:"
          echo "${ARTIFACT_NAME}"
          echo ""

          gh run download "${RUN_ID}" \
            --repo "${{ github.repository }}" \
            --name "${ARTIFACT_NAME}" \
            --dir review

          echo ""
          echo "Downloaded files:"
          echo "=========================================="

          find review -type f -print

          echo ""
          echo "=========================================="


      # ============================================================
      # 4. NORMALIZE REVIEW PACKAGE
      # ============================================================
      # GitHub artifact currently downloads like:
      #
      # review/output/youtube_short.mp4
      # review/output/metadata.json
      #
      # This step copies them into:
      #
      # review/youtube_short.mp4
      # review/metadata.json
      #
      # so the rest of the workflow always uses one fixed path.
      # ============================================================
      - name: Normalize review package
        run: |

          echo "=========================================="
          echo "       NORMALIZING REVIEW PACKAGE"
          echo "=========================================="

          VIDEO_SOURCE="review/output/youtube_short.mp4"
          METADATA_SOURCE="review/output/metadata.json"

          if [ ! -f "$VIDEO_SOURCE" ]; then
            echo ""
            echo "ERROR: youtube_short.mp4 was not found."
            echo ""
            echo "Searching entire review directory:"
            find review -type f -print
            exit 1
          fi

          if [ ! -f "$METADATA_SOURCE" ]; then
            echo ""
            echo "ERROR: metadata.json was not found."
            echo ""
            echo "Searching entire review directory:"
            find review -type f -print
            exit 1
          fi

          cp "$VIDEO_SOURCE" review/youtube_short.mp4
          cp "$METADATA_SOURCE" review/metadata.json

          echo ""
          echo "Normalized files:"
          echo "=========================================="

          ls -lh review/youtube_short.mp4
          ls -lh review/metadata.json

          echo ""
          echo "Review package is ready."
          echo "=========================================="


      # ============================================================
      # 5. CHECK REVIEW PACKAGE
      # ============================================================
      - name: Check review package
        run: |

          echo "=========================================="
          echo "       CHECKING REVIEW PACKAGE"
          echo "=========================================="

          if [ ! -f "review/youtube_short.mp4" ]; then
            echo "ERROR: youtube_short.mp4 not found."
            exit 1
          fi

          if [ ! -f "review/metadata.json" ]; then
            echo "ERROR: metadata.json not found."
            exit 1
          fi

          echo ""
          echo "Video:"
          ls -lh review/youtube_short.mp4

          echo ""
          echo "Metadata:"
          cat review/metadata.json

          echo ""
          echo "=========================================="
          echo "       REVIEW PACKAGE OK"
          echo "=========================================="


      # ============================================================
      # 6. INSTALL YOUTUBE API DEPENDENCIES
      # ============================================================
      - name: Install YouTube API dependencies
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2


      # ============================================================
      # 7. PREPARE YOUTUBE METADATA
      # ============================================================
      - name: Prepare YouTube metadata
        run: |

          python3 - <<'PY'

          import json
          import re


          INPUT_FILE = "review/metadata.json"
          OUTPUT_FILE = "review/youtube_upload.json"


          # ==========================================================
          # LOAD METADATA
          # ==========================================================

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          title = str(
              data.get("title", "")
          ).strip()


          description = str(
              data.get("description", "")
          ).strip()


          category = str(
              data.get("category", "")
          ).strip()


          raw_tags = data.get(
              "tags",
              ""
          )


          # ==========================================================
          # VALIDATE TITLE
          # ==========================================================

          if not title:

              raise RuntimeError(
                  "YouTube title is empty."
              )


          # YouTube title maximum is 100 characters.
          title = title[:100]


          # ==========================================================
          # VALIDATE DESCRIPTION
          # ==========================================================

          if not description:

              raise RuntimeError(
                  "YouTube description is empty."
              )


          # ==========================================================
          # CATEGORY
          # ==========================================================

          category_map = {

              "Music": "10",

              "Entertainment": "24",

              "People & Blogs": "22",

              "Comedy": "23",

              "Sports": "17",

              "Howto & Style": "26",

              "Education": "27"
          }


          category_id = category_map.get(
              category,
              "24"
          )


          # ==========================================================
          # CONVERT TAGS TO LIST
          # ==========================================================

          if isinstance(raw_tags, str):

              raw_tags = raw_tags.split(",")

          elif isinstance(raw_tags, list):

              raw_tags = raw_tags

          else:

              raw_tags = []


          # ==========================================================
          # CLEAN YOUTUBE TAGS
          # ==========================================================

          clean_tags = []

          seen = set()

          total_length = 0


          for item in raw_tags:

              tag = str(item).strip()


              if not tag:
                  continue


              # Remove hashtags.
              tag = tag.replace(
                  "#",
                  " "
              )


              # Remove URLs.
              tag = re.sub(
                  r"https?://\S+|www\.\S+",
                  " ",
                  tag,
                  flags=re.IGNORECASE
              )


              # Remove control characters.
              tag = re.sub(
                  r"[\x00-\x1F\x7F]",
                  " ",
                  tag
              )


              # Keep letters, numbers and spaces.
              # This avoids malformed YouTube keywords.
              tag = re.sub(
                  r"[^A-Za-z0-9\s]",
                  " ",
                  tag
              )


              # Normalize spaces.
              tag = re.sub(
                  r"\s+",
                  " ",
                  tag
              ).strip()


              if not tag:
                  continue


              # Keep individual tags reasonably short.
              tag = tag[:60].strip()


              if not tag:
                  continue


              key = tag.lower()


              # Remove duplicates.
              if key in seen:
                  continue


              # YouTube total tag limit is 500 characters.
              extra_length = len(tag)

              if clean_tags:
                  extra_length += 1


              # Stay safely below the limit.
              if total_length + extra_length > 450:
                  break


              clean_tags.append(tag)

              seen.add(key)

              total_length += extra_length


          # ==========================================================
          # FINAL TAG STRING
          # ==========================================================

          final_tags = ",".join(
              clean_tags
          )


          # Absolute safety check.
          if len(final_tags) > 500:

              final_tags = final_tags[:500]


          # ==========================================================
          # CREATE OUTPUT
          # ==========================================================

          output = {

              "title": title,

              "description": description,

              "tags": clean_tags,

              "category_id": category_id
          }


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ==========================================================
          # DEBUG
          # ==========================================================

          print("")
          print("==========================================")
          print("       YOUTUBE UPLOAD METADATA")
          print("==========================================")

          print("")
          print("TITLE:")
          print(title)

          print("")
          print("CATEGORY:")
          print(category)

          print("")
          print("CATEGORY ID:")
          print(category_id)

          print("")
          print("DESCRIPTION CHARACTERS:")
          print(len(description))

          print("")
          print("SEO TAG COUNT:")
          print(len(clean_tags))

          print("")
          print("SEO TAG CHARACTERS:")
          print(len(final_tags))

          print("")
          print("SEO TAGS:")
          print(final_tags)

          print("")
          print("==========================================")
          print("       METADATA READY")
          print("==========================================")

          PY


      # ============================================================
      # 8. UPLOAD SHORT TO YOUTUBE
      # ============================================================
      - name: Upload Short to YouTube

        env:

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |

          cat > upload_youtube.py <<'PY'

          import os
          import json
          import time


          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload

          from googleapiclient.errors import HttpError


          # ==========================================================
          # LOAD SECRETS
          # ==========================================================

          client_id = os.environ.get(
              "YOUTUBE_CLIENT_ID"
          )


          client_secret = os.environ.get(
              "YOUTUBE_CLIENT_SECRET"
          )


          refresh_token = os.environ.get(
              "YOUTUBE_REFRESH_TOKEN"
          )


          if not client_id:

              raise RuntimeError(
                  "YOUTUBE_CLIENT_ID secret is missing."
              )


          if not client_secret:

              raise RuntimeError(
                  "YOUTUBE_CLIENT_SECRET secret is missing."
              )


          if not refresh_token:

              raise RuntimeError(
                  "YOUTUBE_REFRESH_TOKEN secret is missing."
              )


          # ==========================================================
          # LOAD METADATA
          # ==========================================================

          with open(
              "review/youtube_upload.json",
              "r",
              encoding="utf-8"
          ) as f:

              metadata = json.load(f)


          title = metadata["title"]

          description = metadata["description"]

          tags = metadata["tags"]

          category_id = metadata["category_id"]


          # ==========================================================
          # FINAL TAG SAFETY
          # ==========================================================

          if not isinstance(
              tags,
              list
          ):

              tags = []


          safe_tags = []

          total_length = 0

          seen = set()


          for tag in tags:

              tag = str(tag).strip()


              if not tag:
                  continue


              # Remove hashtags.
              tag = tag.replace(
                  "#",
                  " "
              )


              # Remove commas because comma separates YouTube tags.
              tag = tag.replace(
                  ",",
                  " "
              )


              # Normalize spaces.
              tag = " ".join(
                  tag.split()
              )


              if not tag:
                  continue


              tag = tag[:60]


              key = tag.lower()


              if key in seen:
                  continue


              extra = len(tag)

              if safe_tags:
                  extra += 1


              if total_length + extra > 450:
                  break


              safe_tags.append(tag)

              seen.add(key)

              total_length += extra


          tags = safe_tags


          # ==========================================================
          # BUILD OAUTH
          # ==========================================================

          credentials = Credentials(

              token=None,

              refresh_token=refresh_token,

              token_uri="https://oauth2.googleapis.com/token",

              client_id=client_id,

              client_secret=client_secret,

              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          # ==========================================================
          # BUILD YOUTUBE CLIENT
          # ==========================================================

          youtube = build(

              "youtube",

              "v3",

              credentials=credentials
          )


          # ==========================================================
          # DEBUG
          # ==========================================================

          print("")
          print("==========================================")
          print("          YOUTUBE UPLOAD")
          print("==========================================")

          print("")
          print("Title:")
          print(title)

          print("")
          print("Category ID:")
          print(category_id)

          print("")
          print("SEO tag count:")
          print(len(tags))

          print("")
          print("SEO tag characters:")
          print(
              len(",".join(tags))
          )

          print("")
          print("Video:")
          print(
              "review/youtube_short.mp4"
          )


          # ==========================================================
          # UPLOAD FUNCTION
          # ==========================================================

          def upload_video(
              tags_to_use
          ):

              body = {

                  "snippet": {

                      "title": title,

                      "description": description,

                      "tags": tags_to_use,

                      "categoryId": category_id
                  },

                  "status": {

                      "privacyStatus": "public",

                      "selfDeclaredMadeForKids": False
                  }
              }


              media = MediaFileUpload(

                  "review/youtube_short.mp4",

                  mimetype="video/mp4",

                  resumable=True
              )


              request = youtube.videos().insert(

                  part="snippet,status",

                  body=body,

                  media_body=media
              )


              response = None


              while response is None:

                  status, response = request.next_chunk()


                  if status:

                      progress = int(
                          status.progress() * 100
                      )

                      print(
                          f"Upload progress: {progress}%"
                      )


              return response


          # ==========================================================
          # UPLOAD WITH RETRIES
          # ==========================================================

          response = None

          max_attempts = 5


          for attempt in range(
              1,
              max_attempts + 1
          ):

              try:

                  print("")
                  print(
                      f"Upload attempt "
                      f"{attempt}/{max_attempts}"
                  )


                  response = upload_video(
                      tags
                  )


                  break


              except HttpError as error:

                  status_code = getattr(
                      error.resp,
                      "status",
                      None
                  )


                  error_text = str(
                      error
                  )


                  print("")
                  print(
                      f"YouTube API error: "
                      f"HTTP {status_code}"
                  )

                  print(
                      error_text
                  )


                  # ==================================================
                  # INVALID TAGS
                  # ==================================================

                  if (

                      status_code == 400

                      and

                      "invalidTags"
                      in error_text
                  ):

                      print("")
                      print(
                          "YouTube rejected the SEO tags."
                      )

                      print(
                          "Retrying upload WITHOUT tags..."
                      )

                      response = upload_video(
                          []
                      )

                      print(
                          "Upload succeeded without SEO tags."
                      )

                      break


                  # ==================================================
                  # TEMPORARY SERVER ERROR
                  # ==================================================

                  if status_code in [

                      500,

                      502,

                      503,

                      504

                  ]:

                      if attempt < max_attempts:

                          wait_time = (
                              attempt * 10
                          )


                          print(
                              f"Temporary YouTube error."
                          )


                          print(
                              f"Retrying in "
                              f"{wait_time} seconds..."
                          )


                          time.sleep(
                              wait_time
                          )


                          continue


                  raise


          # ==========================================================
          # FINAL VALIDATION
          # ==========================================================

          if not response:

              raise RuntimeError(
                  "YouTube upload failed."
              )


          video_id = response.get(
              "id"
          )


          if not video_id:

              raise RuntimeError(
                  "YouTube returned no video ID."
              )


          video_url = (
              "https://www.youtube.com/watch?v="
              + video_id
          )


          # ==========================================================
          # CHANNEL INFORMATION
          # ==========================================================

          response_snippet = response.get(
              "snippet",
              {}
          )


          channel_id = response_snippet.get(
              "channelId",
              ""
          )


          channel_name = response_snippet.get(
              "channelTitle",
              ""
          )


          # ==========================================================
          # SUCCESS
          # ==========================================================

          print("")
          print("==========================================")
          print("       YOUTUBE UPLOAD SUCCESS")
          print("==========================================")

          print("")
          print("Channel:")
          print(channel_name)

          print("")
          print("Channel ID:")
          print(channel_id)

          print("")
          print("Video ID:")
          print(video_id)

          print("")
          print("YouTube URL:")
          print(video_url)

          print("")
          print("Privacy:")
          print("PUBLIC")

          print("")
          print("SEO tags used:")
          print(len(tags))

          print("")
          print("==========================================")


          # ==========================================================
          # SAVE RESULT
          # ==========================================================

          result = {

              "status": "uploaded",

              "video_id": video_id,

              "url": video_url,

              "title": title,

              "channel": channel_name,

              "channel_id": channel_id,

              "privacy": "public",

              "seo_tag_count": len(tags),

              "seo_tag_characters": len(
                  ",".join(tags)
              )
          }


          with open(
              "review/upload_result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "Upload result saved."
          )

          PY


          python3 upload_youtube.py


      # ============================================================
      # 9. CREATE UPLOAD SUMMARY
      # ============================================================
      - name: Create Upload Summary
        run: |

          echo "# 🎬 ReelToTube - YouTube Upload" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## ✅ Upload Successful" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"

          import json


          with open(
              "review/upload_result.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print(
              "**Title:** "
              + data.get(
                  "title",
                  ""
              )
          )


          print("")


          print(
              "**Video ID:** "
              + data.get(
                  "video_id",
                  ""
              )
          )


          print("")


          print(
              "**YouTube URL:** "
              + data.get(
                  "url",
                  ""
              )
          )


          print("")


          print(
              "**Privacy:** "
              + data.get(
                  "privacy",
                  ""
              )
          )


          print("")


          print(
              "**SEO Tags:** "
              + str(
                  data.get(
                      "seo_tag_count",
                      0
                  )
              )
          )

          PY


      # ============================================================
      # 10. SAVE UPLOAD RESULT
      # ============================================================
      - name: Save Upload Result
        uses: actions/upload-artifact@v4

        with:

          name: ReelToTube-Upload-Result-${{ github.run_id }}

          path: |

            review/upload_result.json

            review/youtube_upload.json

          retention-days: 7


      # ============================================================
      # 11. FINAL STATUS
      # ============================================================
      - name: Upload Complete
        run: |

          echo ""
          echo "=========================================="
          echo "       REELTOTUBE UPLOAD COMPLETE"
          echo "=========================================="

          echo ""

          echo "The approved Short was uploaded to YouTube."

          echo ""

          echo "=========================================="
