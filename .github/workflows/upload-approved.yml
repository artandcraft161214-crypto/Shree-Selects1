name: Upload Approved Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Run ID containing the processed Reel"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW RUN ID
      # ============================================================
      - name: Show Run ID
        run: |
          echo "=========================================="
          echo "       UPLOAD APPROVED SHORT"
          echo "=========================================="
          echo ""
          echo "Source Run ID:"
          echo "${{ inputs.run_id }}"
          echo ""
          echo "=========================================="


      # ============================================================
      # 3. DOWNLOAD REVIEW ARTIFACT
      # ============================================================
      - name: Download processed Reel package
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}

        run: |
          echo "=========================================="
          echo "       DOWNLOADING REVIEW PACKAGE"
          echo "=========================================="

          rm -rf review
          mkdir -p review

          ARTIFACT_NAME="ReelToTube-Review-${RUN_ID}"

          echo ""
          echo "Artifact:"
          echo "${ARTIFACT_NAME}"
          echo ""

          gh run download "${RUN_ID}" \
            --repo "${{ github.repository }}" \
            --name "${ARTIFACT_NAME}" \
            --dir review

          echo ""
          echo "Downloaded files:"
          echo "=========================================="

          find review -type f -print

          echo ""
          echo "=========================================="


      # ============================================================
      # 4. NORMALIZE REVIEW PACKAGE
      # ============================================================
      - name: Normalize review package
        run: |
          echo "=========================================="
          echo "       NORMALIZING REVIEW PACKAGE"
          echo "=========================================="

          VIDEO_SOURCE="review/output/youtube_short.mp4"
          METADATA_SOURCE="review/output/metadata.json"

          if [ ! -f "$VIDEO_SOURCE" ]; then
            echo ""
            echo "ERROR: youtube_short.mp4 was not found."
            echo ""
            find review -type f -print
            exit 1
          fi

          if [ ! -f "$METADATA_SOURCE" ]; then
            echo ""
            echo "ERROR: metadata.json was not found."
            echo ""
            find review -type f -print
            exit 1
          fi

          cp "$VIDEO_SOURCE" review/youtube_short.mp4
          cp "$METADATA_SOURCE" review/metadata.json

          echo ""
          echo "Normalized files:"
          ls -lh review/youtube_short.mp4
          ls -lh review/metadata.json

          echo ""
          echo "Review package is ready."


      # ============================================================
      # 5. CHECK REVIEW PACKAGE
      # ============================================================
      - name: Check review package
        run: |
          echo "=========================================="
          echo "       CHECKING REVIEW PACKAGE"
          echo "=========================================="

          if [ ! -f "review/youtube_short.mp4" ]; then
            echo "ERROR: youtube_short.mp4 not found."
            exit 1
          fi

          if [ ! -f "review/metadata.json" ]; then
            echo "ERROR: metadata.json not found."
            exit 1
          fi

          echo ""
          echo "Video:"
          ls -lh review/youtube_short.mp4

          echo ""
          echo "Metadata:"
          cat review/metadata.json

          echo ""
          echo "=========================================="
          echo "       REVIEW PACKAGE OK"
          echo "=========================================="


      # ============================================================
      # 6. INSTALL YOUTUBE API DEPENDENCIES
      # ============================================================
      - name: Install YouTube API dependencies
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2


      # ============================================================
      # 7. PREPARE YOUTUBE METADATA
      # ============================================================
      - name: Prepare YouTube metadata
        run: |
          python3 - <<'PY'
          import json
          import re

          INPUT_FILE = "review/metadata.json"
          OUTPUT_FILE = "review/youtube_upload.json"

          with open(INPUT_FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          title = str(data.get("title", "")).strip()
          description = str(data.get("description", "")).strip()
          category = str(data.get("category", "")).strip()
          raw_tags = data.get("tags", "")

          # ==========================================================
          # TITLE
          # ==========================================================

          if not title:
              raise RuntimeError("YouTube title is empty.")

          title = title[:100]

          # ==========================================================
          # DESCRIPTION
          # ==========================================================

          if not description:
              raise RuntimeError("YouTube description is empty.")

          # ==========================================================
          # CATEGORY
          # ==========================================================

          category_map = {
              "Music": "10",
              "Entertainment": "24",
              "People & Blogs": "22",
              "Comedy": "23",
              "Sports": "17",
              "Howto & Style": "26",
              "Education": "27"
          }

          category_id = category_map.get(category, "24")

          # ==========================================================
          # TAGS
          # ==========================================================

          if isinstance(raw_tags, str):
              raw_tags = raw_tags.split(",")
          elif not isinstance(raw_tags, list):
              raw_tags = []

          clean_tags = []
          seen = set()
          total_length = 0

          for item in raw_tags:

              tag = str(item).strip()

              if not tag:
                  continue

              tag = tag.replace("#", " ")

              tag = re.sub(
                  r"https?://\S+|www\.\S+",
                  " ",
                  tag,
                  flags=re.IGNORECASE
              )

              tag = re.sub(
                  r"[\x00-\x1F\x7F]",
                  " ",
                  tag
              )

              tag = re.sub(
                  r"[^A-Za-z0-9\s]",
                  " ",
                  tag
              )

              tag = re.sub(
                  r"\s+",
                  " ",
                  tag
              ).strip()

              if not tag:
                  continue

              tag = tag[:60].strip()

              key = tag.lower()

              if key in seen:
                  continue

              extra_length = len(tag)

              if clean_tags:
                  extra_length += 1

              if total_length + extra_length > 450:
                  break

              clean_tags.append(tag)
              seen.add(key)
              total_length += extra_length

          final_tags = ",".join(clean_tags)

          if len(final_tags) > 500:
              final_tags = final_tags[:500]

          output = {
              "title": title,
              "description": description,
              "tags": clean_tags,
              "category_id": category_id
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==========================================")
          print("       YOUTUBE UPLOAD METADATA")
          print("==========================================")

          print("")
          print("TITLE:")
          print(title)

          print("")
          print("CATEGORY:")
          print(category)

          print("")
          print("CATEGORY ID:")
          print(category_id)

          print("")
          print("DESCRIPTION CHARACTERS:")
          print(len(description))

          print("")
          print("SEO TAG COUNT:")
          print(len(clean_tags))

          print("")
          print("SEO TAG CHARACTERS:")
          print(len(final_tags))

          print("")
          print("SEO TAGS:")
          print(final_tags)

          print("")
          print("==========================================")
          print("       METADATA READY")
          print("==========================================")
          PY


      # ============================================================
      # 8. UPLOAD SHORT TO YOUTUBE
      # ============================================================
      - name: Upload Short to YouTube

        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |

          cat > upload_youtube.py <<'PY'

          import os
          import json

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError


          # ==========================================================
          # FILES
          # ==========================================================

          VIDEO_FILE = "review/youtube_short.mp4"
          METADATA_FILE = "review/youtube_upload.json"

          # IMPORTANT:
          # This exact filename is used by the next steps.
          RESULT_FILE = "review/upload_result.json"


          # ==========================================================
          # LOAD SECRETS
          # ==========================================================

          client_id = os.environ.get(
              "YOUTUBE_CLIENT_ID"
          )

          client_secret = os.environ.get(
              "YOUTUBE_CLIENT_SECRET"
          )

          refresh_token = os.environ.get(
              "YOUTUBE_REFRESH_TOKEN"
          )


          if not client_id:
              raise RuntimeError(
                  "YOUTUBE_CLIENT_ID secret is missing."
              )


          if not client_secret:
              raise RuntimeError(
                  "YOUTUBE_CLIENT_SECRET secret is missing."
              )


          if not refresh_token:
              raise RuntimeError(
                  "YOUTUBE_REFRESH_TOKEN secret is missing."
              )


          # ==========================================================
          # CHECK FILES
          # ==========================================================

          print("")
          print("==========================================")
          print("          YOUTUBE UPLOAD")
          print("==========================================")

          print("")
          print("Checking video file...")

          if not os.path.isfile(VIDEO_FILE):
              raise RuntimeError(
                  f"Video file not found: {VIDEO_FILE}"
              )

          print(
              f"Video found: {VIDEO_FILE}"
          )


          print("")
          print("Checking metadata...")

          if not os.path.isfile(METADATA_FILE):
              raise RuntimeError(
                  f"Metadata file not found: {METADATA_FILE}"
              )

          print(
              f"Metadata found: {METADATA_FILE}"
          )


          # ==========================================================
          # LOAD METADATA
          # ==========================================================

          with open(
              METADATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              metadata = json.load(f)


          title = str(
              metadata.get(
                  "title",
                  "YouTube Short"
              )
          ).strip()


          description = str(
              metadata.get(
                  "description",
                  ""
              )
          ).strip()


          tags = metadata.get(
              "tags",
              []
          )


          category_id = str(
              metadata.get(
                  "category_id",
                  "22"
              )
          )


          # ==========================================================
          # TAG SAFETY
          # ==========================================================

          if not isinstance(tags, list):
              tags = []


          safe_tags = []
          total_length = 0
          seen = set()


          for tag in tags:

              tag = str(tag).strip()

              if not tag:
                  continue

              tag = tag.replace(
                  "#",
                  " "
              )

              tag = tag.replace(
                  ",",
                  " "
              )

              tag = " ".join(
                  tag.split()
              )

              if not tag:
                  continue

              tag = tag[:60]

              key = tag.lower()

              if key in seen:
                  continue

              extra = len(tag)

              if safe_tags:
                  extra += 1

              if total_length + extra > 450:
                  break

              safe_tags.append(tag)
              seen.add(key)
              total_length += extra


          tags = safe_tags


          # ==========================================================
          # CREATE OAUTH CREDENTIALS
          # ==========================================================

          print("")
          print(
              "Creating YouTube OAuth credentials..."
          )


          credentials = Credentials(

              token=None,

              refresh_token=refresh_token,

              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=client_id,

              client_secret=client_secret,

              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          # ==========================================================
          # REFRESH ACCESS TOKEN
          # ==========================================================

          print(
              "Refreshing YouTube access token..."
          )


          try:

              credentials.refresh(
                  Request()
              )

          except Exception as e:

              print("")
              print("==========================================")
              print("          YOUTUBE OAUTH ERROR")
              print("==========================================")

              print("")
              print(
                  "The YouTube refresh token could not be refreshed."
              )

              print("")
              print(
                  "Make sure the following three GitHub secrets "
                  "belong to the SAME Google OAuth client:"
              )

              print("")
              print(
                  "YOUTUBE_CLIENT_ID"
              )

              print(
                  "YOUTUBE_CLIENT_SECRET"
              )

              print(
                  "YOUTUBE_REFRESH_TOKEN"
              )

              print("")
              print("Original error:")
              print(repr(e))

              raise RuntimeError(
                  "YouTube OAuth refresh failed."
              )


          print(
              "YouTube access token refreshed successfully."
          )


          # ==========================================================
          # BUILD YOUTUBE CLIENT
          # ==========================================================

          youtube = build(

              "youtube",

              "v3",

              credentials=credentials
          )


          # ==========================================================
          # DEBUG INFORMATION
          # ==========================================================

          print("")
          print("Title:")
          print(title)

          print("")
          print("Category:")
          print(category_id)

          print("")
          print("Tags:")
          print(", ".join(tags))

          print("")
          print("Video:")
          print(VIDEO_FILE)


          # ==========================================================
          # YOUTUBE REQUEST BODY
          # ==========================================================

          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "tags": tags,

                  "categoryId": category_id
              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False
              }
          }


          # ==========================================================
          # MEDIA
          # ==========================================================

          media = MediaFileUpload(

              VIDEO_FILE,

              mimetype="video/mp4",

              resumable=True
          )


          # ==========================================================
          # START UPLOAD
          # ==========================================================

          print("")
          print("==========================================")
          print("       STARTING YOUTUBE UPLOAD")
          print("==========================================")


          try:

              request = youtube.videos().insert(

                  part="snippet,status",

                  body=body,

                  media_body=media
              )


              response = None


              while response is None:

                  status, response = request.next_chunk()

                  if status:

                      progress = int(
                          status.progress() * 100
                      )

                      print(
                          f"Upload progress: {progress}%"
                      )


              video_id = response.get(
                  "id"
              )


              if not video_id:

                  raise RuntimeError(
                      "YouTube upload completed but "
                      "no video ID was returned."
                  )


              video_url = (
                  "https://www.youtube.com/watch?v="
                  + video_id
              )


              # ======================================================
              # SUCCESS
              # ======================================================

              print("")
              print("==========================================")
              print("       YOUTUBE UPLOAD SUCCESS")
              print("==========================================")

              print("")
              print(
                  f"Video ID: {video_id}"
              )

              print(
                  f"Video URL: {video_url}"
              )

              print("")
              print(
                  "Upload completed successfully."
              )


              # ======================================================
              # SAVE UPLOAD RESULT
              # ======================================================

              result = {

                  "success": True,

                  "video_id": video_id,

                  "url": video_url,

                  "title": title,

                  "privacy": "public",

                  "seo_tag_count": len(tags)
              }


              with open(

                  RESULT_FILE,

                  "w",

                  encoding="utf-8"

              ) as f:

                  json.dump(

                      result,

                      f,

                      indent=2,

                      ensure_ascii=False
                  )


              print("")
              print(
                  f"Upload result saved: {RESULT_FILE}"
              )

              print("")
              print(
                  "Upload result file exists:",
                  os.path.isfile(RESULT_FILE)
              )


          except HttpError as e:

              print("")
              print("==========================================")
              print("       YOUTUBE API ERROR")
              print("==========================================")

              print("")
              print(
                  f"HTTP error: {e}"
              )

              raise


          except Exception as e:

              print("")
              print("==========================================")
              print("       YOUTUBE UPLOAD ERROR")
              print("==========================================")

              print("")
              print(
                  repr(e)
              )

              raise

          PY

          python upload_youtube.py


          # ==========================================================
          # VERIFY RESULT FILE
          # ==========================================================

          echo ""
          echo "=========================================="
          echo "       VERIFYING UPLOAD RESULT"
          echo "=========================================="

          if [ ! -f "review/upload_result.json" ]; then

            echo ""
            echo "ERROR: upload_result.json was not created."

            echo ""
            echo "Review directory:"
            find review -maxdepth 2 -type f -print

            exit 1

          fi


          echo ""
          echo "Upload result found:"
          cat review/upload_result.json

          echo ""
          echo "=========================================="


      # ============================================================
      # 9. CREATE UPLOAD SUMMARY
      # ============================================================
      - name: Create Upload Summary
        run: |

          echo "# 🎬 ReelToTube - YouTube Upload" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "## ✅ Upload Successful" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"


          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"

          import json

          RESULT_FILE = "review/upload_result.json"


          with open(
              RESULT_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print(
              "**Title:** "
              + data.get(
                  "title",
                  ""
              )
          )

          print("")

          print(
              "**Video ID:** "
              + data.get(
                  "video_id",
                  ""
              )
          )

          print("")

          print(
              "**YouTube URL:** "
              + data.get(
                  "url",
                  ""
              )
          )

          print("")

          print(
              "**Privacy:** "
              + data.get(
                  "privacy",
                  ""
              )
          )

          print("")

          print(
              "**SEO Tags:** "
              + str(
                  data.get(
                      "seo_tag_count",
                      0
                  )
              )
          )

          PY


      # ============================================================
      # 10. SAVE UPLOAD RESULT
      # ============================================================
      - name: Save Upload Result
        uses: actions/upload-artifact@v4

        with:

          name: ReelToTube-Upload-Result-${{ github.run_id }}

          path: |
            review/upload_result.json
            review/youtube_upload.json

          retention-days: 7


      # ============================================================
      # 11. FINAL STATUS
      # ============================================================
      - name: Upload Complete
        run: |

          echo ""
          echo "=========================================="
          echo "       REELTOTUBE UPLOAD COMPLETE"
          echo "=========================================="

          echo ""
          echo "The approved Short was uploaded to YouTube."

          echo ""
          echo "Upload result:"
          cat review/upload_result.json

          echo ""
          echo "=========================================="
